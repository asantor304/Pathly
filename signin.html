<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathly — sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F7F6}
a{color:#0E6E66}a:hover{color:#0A4F49}
</style>
</head>
<body>
<div id="app"></div>
<noscript>This prototype needs JavaScript turned on.</noscript>

<script type="text/x-template" id="dc-template">
<div style="font-family: Inter, system-ui, sans-serif; color: #172033; background: #F2F7F6; width: 100%; min-height: 100vh; display: flex; flex-direction: column">

<header style="padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #172033">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#0E6E66"></rect><path d="M8 20c0-6 4-6 6-6s6 0 6-6" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round"></path><circle cx="20" cy="8" r="2.2" fill="#FFFFFF"></circle></svg>
<span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px">Pathly</span>
</a>
<span style="font-size: 14px; color: #5B6474">Step {{stepNum}} of 2</span>
</header>

<main style="flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px 64px">
<div style="width: 100%; max-width: 520px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 40px; box-shadow: 0 12px 32px rgba(20,33,61,0.08); box-sizing: border-box">

<sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Sign in to Pathly</h1>
<p style="margin: 0; color: #5B6474; line-height: 1.55">Use the school account you already use for email and classes. No new password to remember.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="school" style="font-weight: 600; font-size: 14px">Your school</label>
<select id="school" style="font: inherit; padding: 13px 14px; border: 1px solid #C9D2DC; border-radius: 10px; background: #FFFFFF"><option>[Your High School]</option><option>[Pilot school 2]</option><option>[Pilot school 3]</option></select>
</div>
<button type="button" onClick="{{ next }}" style="font: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; color: #172033; border: 1px solid #C9D2DC; padding: 14px; border-radius: 10px; cursor: pointer; min-height: 48px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B4555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
Continue with school Google account</button>
<button type="button" onClick="{{ next }}" style="font: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; color: #172033; border: 1px solid #C9D2DC; padding: 14px; border-radius: 10px; cursor: pointer; min-height: 48px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B4555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M12 4v16M4 12h16"></path></svg>
Continue with school Microsoft account</button>
<p style="margin: 0; font-size: 13px; color: #5B6474; line-height: 1.5">Your school adds juniors and seniors each year. Not seeing your account? Ask your school counselor. Pathly never shows ads or sells student data.</p>
</div>
</sc-if>

<sc-if value="{{ isSetup }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">Three quick questions</h1>
<p style="margin: 0; color: #5B6474; line-height: 1.55">These shape your checklist and the guides we show you first. You can change them any time.</p>
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-weight: 600; margin-bottom: 10px">1. What grade are you in?</legend>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<sc-for list="{{ grades }}" as="g" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ g.pressed }}" onClick="{{ g.pick }}" style="{{ g.style }}">{{ g.label }}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="major" style="font-weight: 600">2. What might you want to study?</label>
<input id="major" type="text" placeholder="e.g. Nursing, Engineering, Not sure yet" style="font: inherit; padding: 13px 14px; border: 1px solid #C9D2DC; border-radius: 10px">
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-weight: 600; margin-bottom: 6px">3. Will you be the first in your family to go to college?</legend>
<p style="margin: 0 0 4px; font-size: 14px; color: #5B6474">If yes, we'll turn on extra plain-language explanations at every step.</p>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<sc-for list="{{ firstGen }}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<button type="button" onClick="{{ back }}" style="font: inherit; font-weight: 600; background: none; border: 0; color: #5B6474; cursor: pointer; padding: 12px 4px; min-height: 44px">Back</button>
<a href="student.html" style="background: #0E6E66; color: #FFFFFF; text-decoration: none; font-weight: 600; padding: 14px 22px; border-radius: 10px">Go to my dashboard</a>
</div>
</div>
</sc-if>

</div>
</main>
</div>
</script>

<script type="application/json" id="dc-props">{"$preview":{"width":1440,"height":1000}}</script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, grade: '12', fg: '' };
  }
  chip(on) {
    return 'font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:10px 18px;border-radius:10px;cursor:pointer;' + (on ? 'background:#0E6E66;color:#FFFFFF;border:1px solid #0E6E66' : 'background:#FFFFFF;color:#172033;border:1px solid #C9D2DC');
  }
  renderVals() {
    const st = this.state || {};
    const step = st.step || 1;
    const grades = [{ id: '11', label: 'Junior (11th)' }, { id: '12', label: 'Senior (12th)' }].map((g) => ({
      label: g.label, pressed: st.grade === g.id ? 'true' : 'false', style: this.chip(st.grade === g.id), pick: () => this.setState({ grade: g.id })
    }));
    const firstGen = [{ id: 'y', label: 'Yes' }, { id: 'n', label: 'No' }, { id: 'u', label: 'Not sure' }].map((f) => ({
      label: f.label, pressed: st.fg === f.id ? 'true' : 'false', style: this.chip(st.fg === f.id), pick: () => this.setState({ fg: f.id })
    }));
    return {
      stepNum: step, isSignIn: step === 1, isSetup: step === 2,
      next: () => this.setState({ step: 2 }), back: () => this.setState({ step: 1 }),
      grades: grades, firstGen: firstGen
    };
  }
}
</script>
</body>
</html>
