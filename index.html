<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0"><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 22px">Thanks — we'll be in touch.</span><span style="color: #5B6474">Expect an email from the Pathly team within two school days.</span></div>
